site_name: Flèche
site_url: https://rsoumre.github.io/fleche
site_description: Framework PHP léger avec une API entièrement en français
site_author: Rsoumre

repo_name: Rsoumre/fleche
repo_url: https://github.com/Rsoumre/fleche

extra_css:
  - css/extra.css

theme:
  name: material
  language: fr
  palette:
    - scheme: default
      primary: black
      accent: black
      toggle:
        icon: material/brightness-7
        name: Mode sombre
    - scheme: slate
      primary: black
      accent: black
      toggle:
        icon: material/brightness-4
        name: Mode clair
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Accueil: index.md
  - Guide:
    - Routeur: routeur.md
    - Contrôleurs: controleurs.md
    - Vues: vues.md
    - Réponse: reponse.md
    - Middlewares: middlewares.md
    - Sessions: sessions.md
    - Validation: validation.md
    - Base de données: base-de-donnees.md
    - Upload de fichiers: fichiers.md
    - Variables d'environnement: env.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - tables
